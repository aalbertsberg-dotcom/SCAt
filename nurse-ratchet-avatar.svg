<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#1a6060"/>

  <!-- Ear tufts left -->
  <path d="M52 78 Q40 55 48 42 Q54 48 54 58" fill="#6a5a48"/>
  <path d="M60 72 Q50 48 58 36 Q65 43 63 54" fill="#6a5a48"/>
  <path d="M68 68 Q62 44 72 34 Q77 42 73 53" fill="#6a5a48"/>
  <!-- Ear tufts right -->
  <path d="M148 78 Q160 55 152 42 Q146 48 146 58" fill="#6a5a48"/>
  <path d="M140 72 Q150 48 142 36 Q135 43 137 54" fill="#6a5a48"/>
  <path d="M132 68 Q138 44 128 34 Q123 42 127 53" fill="#6a5a48"/>

  <!-- Left ear -->
  <polygon points="62,85 48,48 78,72" fill="#7a6a58"/>
  <polygon points="64,82 53,55 75,70" fill="#a06060"/>
  <!-- Right ear -->
  <polygon points="138,85 152,48 122,72" fill="#7a6a58"/>
  <polygon points="136,82 147,55 125,70" fill="#a06060"/>

  <!-- Head -->
  <ellipse cx="100" cy="118" rx="58" ry="60" fill="#7a6a58"/>

  <!-- Scraggly fur sides -->
  <path d="M42 100 Q34 96 33 104 Q39 107 44 105" fill="#6a5a48"/>
  <path d="M41 118 Q32 115 31 124 Q38 126 43 123" fill="#6a5a48"/>
  <path d="M158 100 Q166 96 167 104 Q161 107 156 105" fill="#6a5a48"/>
  <path d="M159 118 Q168 115 169 124 Q162 126 157 123" fill="#6a5a48"/>

  <!-- Nurse cap -->
  <rect x="68" y="62" width="64" height="20" rx="2" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="65" y="78" width="70" height="7" rx="1" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Red cross -->
  <rect x="96" y="64" width="8" height="17" fill="#c0392b"/>
  <rect x="91" y="69" width="18" height="7" fill="#c0392b"/>

  <!-- Eyes: heavy lidded judgmental -->
  <!-- Left eye -->
  <ellipse cx="82" cy="112" rx="13" ry="13" fill="white"/>
  <ellipse cx="82" cy="114" rx="9" ry="8" fill="#1e3c18"/>
  <circle cx="82" cy="114" r="6" fill="#080604"/>
  <circle cx="85" cy="111" r="2.5" fill="white"/>
  <!-- Heavy drooping lid -->
  <path d="M69 106 Q82 98 95 106 L96 118 Q82 112 68 118Z" fill="#7a6a58"/>
  <!-- Right eye -->
  <ellipse cx="118" cy="112" rx="13" ry="13" fill="white"/>
  <ellipse cx="118" cy="114" rx="9" ry="8" fill="#1e3c18"/>
  <circle cx="118" cy="114" r="6" fill="#080604"/>
  <circle cx="121" cy="111" r="2.5" fill="white"/>
  <!-- Heavy drooping lid -->
  <path d="M105 106 Q118 98 131 106 L132 118 Q118 112 104 118Z" fill="#7a6a58"/>

  <!-- Nose -->
  <ellipse cx="100" cy="128" rx="7" ry="4.5" fill="#5a3838"/>
  <ellipse cx="100" cy="127" rx="4" ry="2.5" fill="#7a5050"/>

  <!-- Mouth: flat disapproval -->
  <path d="M88 140 Q100 138 112 140" stroke="#4a2e2e" stroke-width="2.5" fill="none"/>

  <!-- Whiskers left -->
  <line x1="93" y1="130" x2="52" y2="120" stroke="#b0a090" stroke-width="1.5" opacity=".8"/>
  <line x1="93" y1="133" x2="50" y2="133" stroke="#b0a090" stroke-width="1.5" opacity=".8"/>
  <line x1="93" y1="136" x2="52" y2="145" stroke="#b0a090" stroke-width="1.5" opacity=".8"/>
  <!-- Whiskers right -->
  <line x1="107" y1="130" x2="148" y2="120" stroke="#b0a090" stroke-width="1.5" opacity=".8"/>
  <line x1="107" y1="133" x2="150" y2="133" stroke="#b0a090" stroke-width="1.5" opacity=".8"/>
  <line x1="107" y1="136" x2="148" y2="145" stroke="#b0a090" stroke-width="1.5" opacity=".8"/>
</svg>
